{% extends 'profiles/base.html' %}
{% load static %}

{% block content %}
<h2>Add New Trip</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <h3>Trip Details</h3>
    {{ trip_form.as_p }}

    <h3>Trip Images</h3>
    {{ formset.management_form }}
    {% for form in formset %}
        {{ form.as_p }}
    {% endfor %}

    <button type="submit">Add Trip</button>
</form>

{% endblock %}
