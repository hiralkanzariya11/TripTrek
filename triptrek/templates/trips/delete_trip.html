{% extends 'profiles/base.html' %}
{% load static %}

{% block content %}
<h2>Delete Trip: {{ trip.title }}</h2>
<p>Are you sure you want to delete this trip?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'trip_list' %}">Cancel</a>
</form>

{% endblock %}
