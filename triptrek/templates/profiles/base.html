<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TripTrek{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #D0F0F6, #FFFBE6);
            min-height: 100vh;
        }

        .dropdown {
        position: relative;
        display: inline-block;
        cursor: pointer;
    }

    /* Dropdown content (hidden by default) */
    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        background-color: rgba(255, 255, 255, 0.95);
        min-width: 150px;
        box-shadow: 0 4px 10px rgba(0, 180, 200, 0.2);
        border-radius: 6px;
        z-index: 100;
    }

    /* Links inside the dropdown */
    .dropdown-content a {
        color: #0098A8;
        padding: 10px 15px;
        text-decoration: none;
        display: block;
        font-weight: 500;
    }

    .dropdown-content a.logout {
        color: #FF6F3C;
    }

    /* Hover effect for dropdown links */
    .dropdown-content a:hover {
        background-color: rgba(0, 152, 168, 0.1);
    }

    /* Show the dropdown on hover */
    .dropdown:hover .dropdown-content {
        display: block;
    }

    /* Optional: small arrow next to username */
    .username::after {
        content: " ";
        margin-left: 5px;
    }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 15px rgba(0, 180, 200, 0.2);
        }

        .navbar .logo {
            font-size: 22px;
            font-weight: bold;
            color: #0098A8;
            text-decoration: none;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #0098A8;
            font-weight: 500;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .username {
            margin-left: 20px;
            color: #333;
            font-weight: 500;
        }

        .logout {
            margin-left: 15px;
            color: #FF6F3C;
            text-decoration: none;
            font-weight: 500;
        }

        .logout:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <!-- LOGO → HOME -->
        <a href="{% url 'home' %}" class="logo">TripTrek</a>

        <div class="nav-links">
            <!-- HOME ALWAYS VISIBLE -->
            <a href="{% url 'home' %}">Home</a>

            {% if user.is_authenticated %}
                <!-- AUTHENTICATED USER -->
                 <div class="dropdown">
                <span class="username">Hello, {{ user.username }} ▼</span>
                <div class="dropdown-content">
                    <a href="{% url 'profiles' %}">Profile</a>
                    <a href="{% url 'trip_list' %}">Trips</a>
                    <a href="{% url 'logout' %}" class="logout">Logout</a>
                </div>
            </div>
                <!-- <a href="{% url 'profiles' %}">Dashboard</a>
                <span class="username">Hello, {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="logout">Logout</a> -->
            {% else %}
                <!-- GUEST USER -->
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    

    {% block content %}{% endblock %}

</body>
</html>
