{% extends 'profiles/base.html' %}

{% block title %}Login | TripTrek{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 80px);
    }

    .login-card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 180, 200, 0.2);
        width: 350px;
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #0098A8;
    }

    input[type=text], input[type=password] {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #D0F0F6;
        margin-bottom: 18px;
        background-color: #FFFBE6;
        color: #333;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #0098A8;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #007C87;
    }

    .message {
        text-align: center;
        color: #FF6F3C;
        margin-bottom: 10px;
    }

    .register-link {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
    }

    .register-link a {
        color: #0098A8;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Login to TripTrek</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="register-link">
            Don’t have an account?
            <a href="{% url 'register' %}">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
